<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070707">
  <title>InkVision — Coming soon</title>
  <meta name="description" content="InkVision — przyszłe studio tatuażu i autorskich projektów. Strona w przygotowaniu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070707;
      --surface: #101010;
      --gold: #c8a96e;
      --text: #eee9df;
      --muted: #8a867e;
      --border: rgba(255,255,255,.09);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 75% 20%, rgba(200,169,110,.13), transparent 30%),
        radial-gradient(circle at 15% 80%, rgba(255,77,109,.06), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }
    body::before {
      content: "INK";
      position: fixed;
      right: -2vw;
      bottom: -10vw;
      color: rgba(255,255,255,.018);
      font: 800 clamp(12rem, 35vw, 34rem)/.8 "Syne", sans-serif;
      letter-spacing: -.1em;
      pointer-events: none;
    }
    main {
      position: relative;
      width: min(100%, 880px);
      padding: clamp(2rem, 7vw, 5rem);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(17,17,17,.94), rgba(8,8,8,.9));
      box-shadow: 0 35px 100px rgba(0,0,0,.55);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 4rem;
      font: 800 1.05rem "Syne", sans-serif;
      letter-spacing: .08em;
    }
    .brand::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 22px rgba(200,169,110,.8);
    }
    .label {
      margin: 0 0 1rem;
      color: var(--gold);
      font-size: .76rem;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 720px;
      margin: 0 0 1.4rem;
      font: 800 clamp(3rem, 10vw, 6.8rem)/.88 "Syne", sans-serif;
      letter-spacing: -.07em;
    }
    h1 span { color: var(--gold); }
    p {
      max-width: 590px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.75;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      margin-top: 2.3rem;
    }
    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: .8rem 1.35rem;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: transform .2s, border-color .2s;
    }
    a:hover { transform: translateY(-2px); border-color: rgba(200,169,110,.5); }
    a.primary { border-color: var(--gold); background: var(--gold); color: #15110b; }
    .status {
      position: absolute;
      top: 2rem;
      right: 2rem;
      padding: .35rem .7rem;
      border: 1px solid rgba(200,169,110,.28);
      border-radius: 99px;
      color: var(--gold);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    @media (max-width: 650px) {
      body { padding: 1rem; }
      main { padding: 2rem 1.4rem; border-radius: 20px; }
      .brand { margin-bottom: 5rem; }
      .status { top: 4.6rem; left: 1.4rem; right: auto; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">INKVISION</div>
    <span class="status">Coming soon</span>
    <p class="label">Studio tatuażu w przygotowaniu</p>
    <h1>Nowy rozdział<br><span>już wkrótce.</span></h1>
    <p>Pracuję nad miejscem poświęconym autorskim projektom, wizualizacjom i przyszłemu studiu tatuażu. Na razie zapraszam na stronę AI CONIC.</p>
    <div class="actions">
      <a class="primary" href="index.html">← Wróć do AI CONIC</a>
      <a href="mailto:leszek.papiez@gmail.com">Napisz e-mail</a>
    </div>
  </main>
</body>
</html>
